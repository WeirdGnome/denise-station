<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a74d0"/><stop offset="1" stop-color="#0a3d8f"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a42"/><stop offset="1" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8d96"/><stop offset=".45" stop-color="#f1f1f4"/><stop offset="1" stop-color="#6c6c75"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff8a80"/><stop offset=".45" stop-color="#e5251d"/><stop offset="1" stop-color="#7d0b08"/>
    </radialGradient>
    <radialGradient id="btn" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff7468"/><stop offset=".6" stop-color="#d81f17"/><stop offset="1" stop-color="#7d0b08"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- floor grid, a nod to 90s demo-scene perspective -->
  <g stroke="#ff9a1f" stroke-width="3" opacity=".55" fill="none">
    <path d="M0 400H512M0 440H512M0 486H512"/>
    <path d="M256 360L-40 512M256 360L100 512M256 360L256 512M256 360L412 512M256 360L552 512"/>
  </g>
  <rect x="0" y="352" width="512" height="8" fill="#ff9a1f"/>
  <!-- shadow -->
  <ellipse cx="256" cy="418" rx="170" ry="22" fill="#000" opacity=".35"/>
  <!-- base -->
  <path d="M96 330 Q96 300 126 296 H386 Q416 300 416 330 V384 Q416 408 392 408 H120 Q96 408 96 384Z" fill="url(#base)"/>
  <path d="M96 330 Q96 300 126 296 H386 Q416 300 416 330 Z" fill="#4a4a54"/>
  <rect x="112" y="318" width="288" height="6" rx="3" fill="#000" opacity=".35"/>
  <!-- fire buttons -->
  <g>
    <ellipse cx="146" cy="352" rx="30" ry="22" fill="#2a0504"/><ellipse cx="146" cy="346" rx="28" ry="19" fill="url(#btn)"/>
    <ellipse cx="366" cy="352" rx="30" ry="22" fill="#2a0504"/><ellipse cx="366" cy="346" rx="28" ry="19" fill="url(#btn)"/>
  </g>
  <!-- stick -->
  <ellipse cx="256" cy="304" rx="44" ry="13" fill="#0b0b0f"/>
  <path d="M242 304 L236 150 Q236 140 246 140 H266 Q276 140 276 150 L270 304Z" fill="url(#shaft)"/>
  <ellipse cx="256" cy="304" rx="30" ry="8" fill="#000" opacity=".25"/>
  <!-- ball top -->
  <circle cx="256" cy="116" r="74" fill="url(#ball)"/>
  <ellipse cx="232" cy="84" rx="22" ry="13" fill="#fff" opacity=".55" transform="rotate(-30 232 84)"/>
  <!-- little sparkle -->
  <path d="M424 72 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#fff" opacity=".9"/>
</svg>
