<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0630"/><stop offset=".5" stop-color="#3a0f6b"/><stop offset="1" stop-color="#c72f8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#ff4f7b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a3d"/><stop offset="1" stop-color="#07031a"/>
    </linearGradient>
    <clipPath id="sunclip"><circle cx="240" cy="330" r="110"/></clipPath>
  </defs>
  <rect width="480" height="640" fill="url(#sky)"/>
  <g fill="#fff">
    <rect x="40" y="120" width="3" height="3"/><rect x="95" y="180" width="2" height="2"/><rect x="150" y="90" width="3" height="3"/>
    <rect x="210" y="150" width="2" height="2"/><rect x="300" y="105" width="3" height="3"/><rect x="360" y="170" width="2" height="2"/>
    <rect x="420" y="130" width="3" height="3"/><rect x="450" y="215" width="2" height="2"/><rect x="60" y="250" width="2" height="2"/>
    <rect x="395" y="260" width="3" height="3"/><rect x="25" y="200" width="2" height="2"/><rect x="270" y="70" width="2" height="2"/>
  </g>
  <g clip-path="url(#sunclip)">
    <rect x="120" y="220" width="240" height="220" fill="url(#sun)"/>
    <g fill="#3a0f6b">
      <rect x="120" y="340" width="240" height="5"/><rect x="120" y="362" width="240" height="8"/>
      <rect x="120" y="386" width="240" height="11"/><rect x="120" y="412" width="240" height="14"/>
    </g>
  </g>
  <rect x="0" y="400" width="480" height="240" fill="url(#ground)"/>
  <g stroke="#ff4fd8" stroke-width="2" fill="none" opacity=".9">
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="0" y1="418" x2="480" y2="418"/><line x1="0" y1="444" x2="480" y2="444"/>
    <line x1="0" y1="480" x2="480" y2="480"/><line x1="0" y1="530" x2="480" y2="530"/>
    <line x1="0" y1="600" x2="480" y2="600"/>
    <line x1="240" y1="400" x2="240" y2="640"/>
    <line x1="240" y1="400" x2="120" y2="640"/><line x1="240" y1="400" x2="0" y2="640"/>
    <line x1="240" y1="400" x2="-120" y2="640"/><line x1="240" y1="400" x2="360" y2="640"/>
    <line x1="240" y1="400" x2="480" y2="640"/><line x1="240" y1="400" x2="600" y2="640"/>
  </g>
  <rect x="30" y="30" width="420" height="580" fill="none" stroke="#00e5ff" stroke-width="4"/>
  <rect x="40" y="40" width="400" height="560" fill="none" stroke="#ff4fd8" stroke-width="2"/>
  <text x="240" y="92" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="bold"
