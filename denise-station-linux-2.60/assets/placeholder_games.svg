  <text x="240" y="548" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold"
        font-size="52" letter-spacing="4" fill="#fff" stroke="#07031a" stroke-width="6" paint-order="stroke">NO COVER</text>
  <text x="240" y="580" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="18"
        letter-spacing="4" fill="#ffe14d">INSERT DISK 1</text>
  <text x="240" y="150" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="bold"
        font-size="46" letter-spacing="5" fill="#fff" stroke="#07031a" stroke-width="6" paint-order="stroke">GAMES</text>
</svg>
